name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compile-esp32:
    name: Compile ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile TIFF_TESTER_PRO_SD_ESP32.ino
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          sketch-paths: |
            - ESP32_Firmware

  compile-nano:
    name: Compile Nano safety firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile TIFF_TESTER_PRO_SD_NANO.ino
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:nano:cpu=atmega328old
          platforms: |
            - name: arduino:avr
          sketch-paths: |
            - Arduino_Nano_Safety
