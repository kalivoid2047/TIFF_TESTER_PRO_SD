name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compile-esp32:
    name: Compile ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Arduino tooling requires a sketch's folder name to match its .ino
      # filename exactly. This repo organizes firmware by controller role
      # (ESP32_Firmware/, Arduino_Nano_Safety/) instead, so stage a
      # correctly-named copy for compilation rather than restructuring the
      # repo. The ESP32 sketch is split across several .ino tabs plus a
      # shared_types.h header, so copy the whole directory's contents.
      - name: Stage sketch for compilation
        run: |
          mkdir -p /tmp/sketches/TIFF_TESTER_PRO_SD_ESP32
          cp ESP32_Firmware/*.ino ESP32_Firmware/*.h /tmp/sketches/TIFF_TESTER_PRO_SD_ESP32/

      # Wi-Fi + WebServer + SD + BLE + CAN + K-Line together exceed the
      # default partition scheme's app space (~1.2MB). This board has no
      # OTA requirement, so trade OTA space for a bigger app partition
      # instead of trimming functionality. See Documentation/ARCHITECTURE.md
      # §6 for the resource-pressure risk this addresses.
      - name: Compile TIFF_TESTER_PRO_SD_ESP32.ino
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          sketch-paths: |
            - /tmp/sketches/TIFF_TESTER_PRO_SD_ESP32

  compile-nano:
    name: Compile Nano safety firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage sketch for compilation
        run: |
          mkdir -p /tmp/sketches/TIFF_TESTER_PRO_SD_NANO
          cp Arduino_Nano_Safety/TIFF_TESTER_PRO_SD_NANO.ino /tmp/sketches/TIFF_TESTER_PRO_SD_NANO/

      - name: Compile TIFF_TESTER_PRO_SD_NANO.ino
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:nano:cpu=atmega328old
          platforms: |
            - name: arduino:avr
          sketch-paths: |
            - /tmp/sketches/TIFF_TESTER_PRO_SD_NANO

  analyze-and-build-app:
    name: Analyze and build TIFF TESTER PRO app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile_App
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
