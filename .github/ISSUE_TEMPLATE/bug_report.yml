name: Bug report
description: Something isn't working as expected (firmware, docs, or CI)
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. If this is a **safety defect** (a
        fault condition that fails to cut DUT power, or similar), please
        use the "Safety issue" template instead so it gets flagged clearly.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ESP32 firmware
        - Arduino Nano safety firmware
        - Module profile (.INI)
        - Wi-Fi / web interface
        - Documentation
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: firmware-version
    attributes:
      label: Firmware version / commit
      placeholder: e.g. commit hash, or "master as of 2026-08-18"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, hardware setup, module profile used, etc.
    validations:
      required: false
