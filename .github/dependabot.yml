version: 2
updates:
  # Keep GitHub Actions used in .github/workflows/ up to date
  # (actions/checkout, arduino/compile-sketches, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
