# TIFF_TESTER_PRO_SD example module profile
# Example only - validate connector pinout and electrical limits
# against the exact module before use.

[MODULE]
id=TOYOTA_HILUX_1KD_TURBO
manufacturer=Toyota
vehicle=Hilux
engine=1KD-FTV
module=Turbo_Actuator
version=1.0

[SAFETY]
min_voltage_v=11.0
max_voltage_v=15.0
max_current_a=5.0

[TEST_RESISTANCE]
enabled=1
min_ohm=3.5
max_ohm=6.5

[TEST_POSITION]
enabled=1
min_voltage_v=0.4
max_voltage_v=4.6

[COMMUNICATION]
protocol=CAN
bitrate=500000

[TESTS]
resistance=1
short_to_ground=1
position_sweep=1
actuator_movement=1
current_monitor=1
pass_fail=1

[SERVICE]
# OEM-specific routines must be validated before implementation.
turbo_actuator_calibration=0
dpf_forced_regeneration=0
injector_pilot_learn=0
scv_learn=0
