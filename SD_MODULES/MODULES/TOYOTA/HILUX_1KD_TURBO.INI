# TIFF_TESTER_PRO_SD example module profile
# Example only - validate connector pinout and electrical limits
# against the exact module before use.

[MODULE]
id=TOYOTA_HILUX_1KD_TURBO
manufacturer=Toyota
vehicle=Hilux
engine=1KD-FTV
module=Turbo_Actuator
version=1.0

[SAFETY]
min_voltage_v=11.0
max_voltage_v=15.0
max_current_a=5.0

[TEST_RESISTANCE]
enabled=1
min_ohm=3.5
max_ohm=6.5

[TEST_POSITION]
enabled=1
min_voltage_v=0.4
max_voltage_v=4.6

[TEST_INJECTOR]
# This module is a turbo actuator, not an injector - disabled here.
# Schema per Documentation/SRS.md §6.1; limits enforced by the Nano's
# INJ_TEST safety supervision once injector driver hardware exists
# (Documentation/ROADMAP.md Phase 1).
enabled=0
default_pulse_width_ms=3.0
max_pulse_width_ms=8.0
default_test_duration_s=5

[TEST_COIL]
# Same as above - not applicable to this module, present for schema.
enabled=0
default_dwell_ms=3.0
max_dwell_ms=8.0
default_test_duration_s=5

[COMMUNICATION]
protocol=CAN
bitrate=500000

[TESTS]
resistance=1
short_to_ground=1
position_sweep=1
actuator_movement=1
current_monitor=1
pass_fail=1

[SERVICE]
# OEM-specific routines must be validated before implementation.
turbo_actuator_calibration=0
dpf_forced_regeneration=0
injector_pilot_learn=0
scv_learn=0
